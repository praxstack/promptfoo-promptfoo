<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img" viewBox="0 0 1120 560"><title id="title">LLM as a judge evaluation flow</title><desc id="desc">A promptfoo test case sends a prompt to the system under test. The candidate output and trusted rubric are passed to a separate judge model, which returns pass, score, and reason.</desc><defs><filter id="shadow" width="120%" height="140%" x="-10%" y="-18%"><feDropShadow dx="0" dy="8" flood-color="#0f172a" flood-opacity=".12" stdDeviation="10"/></filter><marker id="arrow-neutral" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#64748b" d="M2 2 L10 6 L2 10 Z"/></marker><marker id="arrow-blue" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#2563eb" d="M2 2 L10 6 L2 10 Z"/></marker><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,sans-serif}.title{font-size:18px;font-weight:800;fill:#0f172a}.cardTitle{font-size:16px;font-weight:800}.small{font-size:13px;fill:#475569}.micro{font-size:12px;fill:#64748b}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style></defs><rect width="1120" height="560" fill="#f8fafc" rx="24"/><text x="56" y="62" class="title">LLM-as-a-judge flow</text><text x="56" y="88" class="small">Keep the candidate output separate from the trusted rubric, then grade with an independent model.</text><rect width="272" height="322" x="42" y="130" fill="#eff6ff" stroke="#bfdbfe" rx="18"/><text x="70" y="166" fill="#1d4ed8" class="small" font-weight="700">Application under test</text><g filter="url(#shadow)"><rect width="200" height="80" x="78" y="196" fill="#fff" stroke="#cbd5e1" rx="14"/></g><text x="178" y="228" class="cardTitle" text-anchor="middle">Test case</text><text x="178" y="252" class="micro" text-anchor="middle">prompt + vars</text><path stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-neutral)" d="M178 276 L178 316"/><g filter="url(#shadow)"><rect width="200" height="82" x="78" y="326" fill="#fff" stroke="#cbd5e1" rx="14"/></g><text x="178" y="358" class="cardTitle" text-anchor="middle">System under test</text><text x="178" y="382" class="micro" text-anchor="middle">prompt, agent, or RAG app</text><path fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-neutral)" d="M314 367 C360 367 374 250 422 250"/><rect width="288" height="322" x="410" y="130" fill="#fefce8" stroke="#fde68a" rx="18"/><text x="438" y="166" fill="#a16207" class="small" font-weight="700">Evaluation inputs</text><g filter="url(#shadow)"><rect width="214" height="92" x="448" y="198" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" rx="14"/></g><text x="555" y="230" fill="#7c2d12" class="cardTitle" text-anchor="middle">Candidate output</text><text x="555" y="254" fill="#92400e" class="micro" text-anchor="middle">model response</text><text x="555" y="274" fill="#b45309" class="micro" text-anchor="middle">treat as untrusted data</text><g filter="url(#shadow)"><rect width="214" height="78" x="448" y="330" fill="#ecfdf5" stroke="#10b981" stroke-width="2" rx="14"/></g><text x="555" y="360" fill="#065f46" class="cardTitle" text-anchor="middle">Rubric</text><text x="555" y="384" fill="#047857" class="micro" text-anchor="middle">trusted grading criteria</text><path fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-neutral)" d="M662 244 C730 244 732 224 780 224"/><path fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-neutral)" d="M662 370 C730 370 732 292 780 292"/><rect width="300" height="322" x="778" y="130" fill="#f0fdfa" stroke="#99f6e4" rx="18"/><text x="806" y="166" fill="#0f766e" class="small" font-weight="700">Judge layer</text><g filter="url(#shadow)"><rect width="230" height="116" x="812" y="198" fill="#1d4ed8" rx="16"/></g><text x="927" y="238" fill="#fff" font-size="20" font-weight="800" text-anchor="middle">Judge model</text><text x="927" y="264" fill="#dbeafe" font-size="13" text-anchor="middle">grades output against rubric</text><text x="927" y="286" fill="#bfdbfe" font-size="13" text-anchor="middle">separate from the SUT</text><path stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)" d="M927 314 L927 348"/><g filter="url(#shadow)"><rect width="230" height="66" x="812" y="356" fill="#fff" stroke="#cbd5e1" rx="14"/></g><text x="838" y="384" fill="#0f172a" class="mono" font-size="14">{ pass, score, reason }</text><text x="838" y="406" class="micro">stored as assertion results</text><path stroke="#f59e0b" stroke-dasharray="5 5" stroke-width="2" d="M458 300 L458 318"/><text x="470" y="314" fill="#92400e" class="micro">output cannot rewrite rubric</text></svg>