<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img" viewBox="0 0 1040 480"><title id="title">Exact match compared with semantic judging</title><desc id="desc">Two password reset answers use different wording. Exact matching fails because the strings differ, while an LLM judge passes them because the meaning satisfies the rubric.</desc><defs><filter id="shadow" width="120%" height="140%" x="-10%" y="-18%"><feDropShadow dx="0" dy="7" flood-color="#0f172a" flood-opacity=".12" stdDeviation="9"/></filter><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,sans-serif}.label,.title{fill:#0f172a}.title{font-size:20px;font-weight:800}.label{font-size:15px;font-weight:700}.body,.mono{font-size:13px;fill:#475569}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#334155}</style></defs><rect width="1040" height="480" fill="#f8fafc" rx="24"/><text x="52" y="60" class="title">Why exact match is too brittle</text><text x="52" y="86" class="body">The wording differs, but the answer satisfies the same password reset rubric.</text><g filter="url(#shadow)"><rect width="438" height="292" x="52" y="126" fill="#fff" stroke="#fecaca" rx="18"/></g><rect width="438" height="52" x="52" y="126" fill="#fee2e2" rx="18"/><text x="82" y="158" fill="#991b1b" class="label">Exact string match</text><text x="82" y="210" class="body" font-weight="700">Expected</text><text x="82" y="234" class="mono">Click &quot;Forgot password&quot;</text><text x="82" y="254" class="mono">and verify by email or SMS.</text><text x="82" y="292" class="body" font-weight="700">Actual</text><text x="82" y="316" class="mono">Use the Forgot password link,</text><text x="82" y="336" class="mono">then enter the email or SMS code.</text><rect width="132" height="32" x="82" y="374" fill="#dc2626" rx="16"/><text x="148" y="395" fill="#fff" font-size="13" font-weight="800" text-anchor="middle">FAIL</text><text x="230" y="395" class="body">different tokens</text><g filter="url(#shadow)"><rect width="438" height="292" x="550" y="126" fill="#fff" stroke="#bbf7d0" rx="18"/></g><rect width="438" height="52" x="550" y="126" fill="#dcfce7" rx="18"/><text x="580" y="158" fill="#166534" class="label">LLM judge</text><text x="580" y="210" class="body" font-weight="700">Rubric</text><text x="580" y="234" class="mono">Must mention Forgot password</text><text x="580" y="254" class="mono">and email/SMS verification.</text><text x="580" y="292" class="body" font-weight="700">Semantic check</text><text x="580" y="316" class="mono">Same action + verification step.</text><text x="580" y="336" class="mono">Valid paraphrase.</text><rect width="132" height="32" x="580" y="374" fill="#16a34a" rx="16"/><text x="646" y="395" fill="#fff" font-size="13" font-weight="800" text-anchor="middle">PASS</text><text x="728" y="395" class="body">same meaning</text></svg>