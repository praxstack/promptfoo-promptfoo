<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img" viewBox="0 0 1120 500"><title id="title">LLM judge calibration workflow</title><desc id="desc">A five-step workflow: pick one dimension, label a golden set, tune the rubric, validate on holdout data, then monitor in CI for drift.</desc><defs><filter id="shadow" width="120%" height="140%" x="-10%" y="-18%"><feDropShadow dx="0" dy="7" flood-color="#0f172a" flood-opacity=".11" stdDeviation="9"/></filter><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#64748b" d="M2 2 L10 6 L2 10 Z"/></marker><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,sans-serif}.step,.title{font-weight:800;fill:#0f172a}.title{font-size:20px}.step{font-size:15px}.body{font-size:13px;fill:#475569}.num{font-size:14px;font-weight:900;fill:#fff}</style></defs><rect width="1120" height="500" fill="#f8fafc" rx="24"/><text x="52" y="60" class="title">Build a judge like production code</text><text x="52" y="86" class="body">Tune on labeled examples, then verify the rubric on data it has never seen.</text><g filter="url(#shadow)"><rect width="180" height="180" x="50" y="140" fill="#fff" stroke="#cbd5e1" rx="18"/></g><circle cx="140" cy="170" r="16" fill="#2563eb"/><text x="140" y="175" class="num" text-anchor="middle">1</text><text x="140" y="210" class="step" text-anchor="middle">Pick one</text><text x="140" y="232" class="step" text-anchor="middle">dimension</text><text x="140" y="272" class="body" text-anchor="middle">accuracy, safety,</text><text x="140" y="294" class="body" text-anchor="middle">tone, completeness</text><path stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" d="M230 230 L248 230"/><g filter="url(#shadow)"><rect width="180" height="180" x="258" y="140" fill="#fff" stroke="#cbd5e1" rx="18"/></g><circle cx="348" cy="170" r="16" fill="#0f766e"/><text x="348" y="175" class="num" text-anchor="middle">2</text><text x="348" y="210" class="step" text-anchor="middle">Label</text><text x="348" y="232" class="step" text-anchor="middle">golden set</text><text x="348" y="272" class="body" text-anchor="middle">clear pass/fail</text><text x="348" y="294" class="body" text-anchor="middle">plus edge cases</text><path stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" d="M438 230 L456 230"/><g filter="url(#shadow)"><rect width="180" height="180" x="466" y="140" fill="#fff" stroke="#cbd5e1" rx="18"/></g><circle cx="556" cy="170" r="16" fill="#d97706"/><text x="556" y="175" class="num" text-anchor="middle">3</text><text x="556" y="210" class="step" text-anchor="middle">Tune</text><text x="556" y="232" class="step" text-anchor="middle">rubric</text><text x="556" y="272" class="body" text-anchor="middle">review reasons,</text><text x="556" y="294" class="body" text-anchor="middle">tighten criteria</text><path stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" d="M646 230 L664 230"/><g filter="url(#shadow)"><rect width="180" height="180" x="674" y="140" fill="#fff" stroke="#cbd5e1" rx="18"/></g><circle cx="764" cy="170" r="16" fill="#7c3aed"/><text x="764" y="175" class="num" text-anchor="middle">4</text><text x="764" y="210" class="step" text-anchor="middle">Validate</text><text x="764" y="232" class="step" text-anchor="middle">holdout</text><text x="764" y="272" class="body" text-anchor="middle">no tuning on</text><text x="764" y="294" class="body" text-anchor="middle">holdout split</text><path stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" d="M854 230 L872 230"/><g filter="url(#shadow)"><rect width="180" height="180" x="882" y="140" fill="#fff" stroke="#cbd5e1" rx="18"/></g><circle cx="972" cy="170" r="16" fill="#334155"/><text x="972" y="175" class="num" text-anchor="middle">5</text><text x="972" y="210" class="step" text-anchor="middle">CI drift</text><text x="972" y="232" class="step" text-anchor="middle">watch</text><text x="972" y="272" class="body" text-anchor="middle">watch agreement</text><text x="972" y="294" class="body" text-anchor="middle">in CI</text><path fill="none" stroke="#d97706" stroke-dasharray="6 6" stroke-width="2" marker-end="url(#arrow)" d="M556 320 C556 394 348 394 348 326"/><text x="560" y="420" fill="#92400e" class="body" text-anchor="middle">If agreement is low, revise the rubric and rerun the golden set.</text></svg>