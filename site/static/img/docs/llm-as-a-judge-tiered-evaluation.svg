<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img" viewBox="0 0 1120 500"><title id="title">Tiered production evaluation</title><desc id="desc">A production evaluation pipeline starts with deterministic checks, then cheap judge checks, and routes high-risk or borderline rows to an expensive judge.</desc><defs><filter id="shadow" width="120%" height="140%" x="-10%" y="-18%"><feDropShadow dx="0" dy="7" flood-color="#0f172a" flood-opacity=".11" stdDeviation="9"/></filter><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#64748b" d="M2 2 L10 6 L2 10 Z"/></marker><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,sans-serif}.cardTitle,.title{font-weight:800;fill:#0f172a}.title{font-size:20px}.cardTitle{font-size:18px}.body{font-size:13px;fill:#475569}.pill{font-size:12px;font-weight:800;fill:#fff}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;fill:#334155}</style></defs><rect width="1120" height="500" fill="#f8fafc" rx="24"/><text x="52" y="60" class="title">Tiered evaluation keeps cost proportional to risk</text><text x="52" y="86" class="body">Run cheap checks everywhere, then reserve expensive judges for high-risk or borderline rows.</text><g filter="url(#shadow)"><rect width="250" height="184" x="72" y="150" fill="#fff" stroke="#bfdbfe" rx="20"/></g><rect width="82" height="28" x="96" y="176" fill="#2563eb" rx="14"/><text x="137" y="195" class="pill" text-anchor="middle">TIER 1</text><text x="96" y="234" class="cardTitle">Deterministic</text><text x="96" y="264" class="body">is-json, regex,</text><text x="96" y="286" class="body">JavaScript, Python</text><text x="96" y="316" class="mono">cheap + exact</text><path stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" d="M322 242 L404 242"/><g filter="url(#shadow)"><rect width="250" height="184" x="414" y="150" fill="#fff" stroke="#a7f3d0" rx="20"/></g><rect width="82" height="28" x="438" y="176" fill="#059669" rx="14"/><text x="479" y="195" class="pill" text-anchor="middle">TIER 2</text><text x="438" y="234" class="cardTitle">Cheap judge</text><text x="438" y="264" class="body">simple rubric,</text><text x="438" y="286" class="body">small grader model</text><text x="438" y="316" class="mono">broad coverage</text><path stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" d="M664 242 L746 242"/><g filter="url(#shadow)"><rect width="292" height="184" x="756" y="150" fill="#fff" stroke="#fed7aa" rx="20"/></g><rect width="82" height="28" x="780" y="176" fill="#ea580c" rx="14"/><text x="821" y="195" class="pill" text-anchor="middle">TIER 3</text><text x="780" y="234" class="cardTitle">Expensive judge</text><text x="780" y="264" class="body">complex rubric, high-risk route,</text><text x="780" y="286" class="body">or borderline failure</text><text x="780" y="316" class="mono">--filter-metadata risk=high</text><path fill="none" stroke="#64748b" stroke-dasharray="6 6" stroke-width="2" marker-end="url(#arrow)" d="M196 334 C196 410 902 410 902 340"/><text x="560" y="434" class="body" text-anchor="middle">Only selected rows need the most expensive model-graded evaluation.</text></svg>